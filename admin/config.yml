backend:
  name: git-gateway
  branch: main

# Dónde vive el sitio publicado — necesario para el botón "Preview"
site_url: https://the-gallery-condesa.netlify.app

media_folder: "assets/img/blog"
public_folder: "assets/img/blog"

collections:
  - name: "living_condesa"
    label: "Viviendo La Condesa — Blog"
    files:
      - file: "content/posts.json"
        label: "Posts"
        name: "posts_file"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Slug (URL, sin espacios)", name: "slug", widget: "string" }
              - label: "Categoría"
                name: "category"
                widget: "select"
                options: ["Guía", "Mañana", "Vida nocturna", "Bicis", "Arte", "Comida", "Comunidad"]
              - { label: "Fecha", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
              - label: "Foto de portada"
                name: "cover"
                widget: "image"
                hint: "Esta misma foto es también el hero (la imagen grande de arriba) en la página del post, si tiene página propia. No hace falta subirla en ningún otro lado."
              - { label: "Extracto (se ve en la tarjeta)", name: "excerpt", widget: "text" }
              - label: "Página propia (SEO) — opcional"
                name: "url"
                widget: "string"
                required: false
                hint: "Solo para piezas de guía con su propia página HTML (ej. living-condesa/nombre.html). Si lo llenas, la tarjeta lleva directo a esa página en vez de abrir el modal — y el contenido de abajo (Contenido) se ignora."
              - label: "Contenido"
                name: "body"
                widget: "text"
                required: false
                hint: "Solo se usa si 'Página propia' está vacío. Separa los párrafos con una línea en blanco."

              # ---------- Versión en inglés (opcional) ----------
              # El sitio empieza en inglés. Si un campo en inglés está vacío,
              # el sitio muestra el texto en español en su lugar.
              - { label: "Título (EN)", name: "title_en", widget: "string", required: false }
              - { label: "Categoría (EN)", name: "category_en", widget: "string", required: false, hint: "Ej. Guide, Morning, Nightlife, Bikes, Art, Food, Community" }
              - { label: "Extracto (EN)", name: "excerpt_en", widget: "text", required: false }
              - { label: "Página propia (EN) — opcional", name: "url_en", widget: "string", required: false, hint: "Ej. living-condesa/en/nombre.html — la versión en inglés de la página del post." }
              - { label: "Contenido (EN)", name: "body_en", widget: "text", required: false, hint: "Solo si el post no tiene página propia. Separa los párrafos con una línea en blanco." }
